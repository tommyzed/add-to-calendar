name: Deploy auth-bridge Cloud Run Service

on:
  push:
    branches:
      - main
    paths:
      - 'functions/auth-bridge/**'
      - '.github/workflows/deploy-auth-bridge.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy auth-bridge \
            --region=europe-west1 \
            --source=./functions/auth-bridge \
            --allow-unauthenticated \
            --set-secrets="GEMINI_APP_KEY=GEMINI_APP_KEY:latest,CLIENT_ID=CLIENT_ID:latest,CLIENT_SECRET=CLIENT_SECRET:latest"
